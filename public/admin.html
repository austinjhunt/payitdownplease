<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Pay It Down Please</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #4ade80;
  --green-dim: #16a34a;
  --green-bg: #0d2b1a;
  --red: #f87171;
  --amber: #fbbf24;
  --cyan: #22d3ee;
  --bg: #080808;
  --bg2: #111111;
  --bg3: #1a1a1a;
  --border: #222;
  --border2: #2a2a2a;
  --text: #e8e0cc;
  --text2: #888;
  --text3: #444;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,80,0.012) 2px, rgba(0,255,80,0.012) 4px);
  pointer-events: none;
  z-index: 9998;
}

.header {
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.header-title {
  font-family: 'Bebas Neue', serif;
  font-size: 1.8rem;
  letter-spacing: 0.08em;
  color: var(--red);
}

.header-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem;
  color: var(--text3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.back-link {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem;
  color: var(--text3);
  text-decoration: none;
  letter-spacing: 0.08em;
  border: 1px solid var(--border2);
  padding: 0.4rem 0.8rem;
  border-radius: 4px;
  transition: color 0.15s, border-color 0.15s;
}
.back-link:hover { color: var(--green); border-color: var(--green); }

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

/* AUTH GATE */
#auth-section {
  max-width: 400px;
  margin: 4rem auto;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 2rem;
}

.auth-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  color: var(--green);
  text-transform: uppercase;
  margin-bottom: 1.2rem;
}

.field {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85rem;
  padding: 0.5rem 0.75rem;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 0.75rem;
}
.field:focus { border-color: var(--green); }
.field::placeholder { color: var(--text3); font-style: italic; }

.btn {
  width: 100%;
  background: var(--green);
  color: #080808;
  border: none;
  font-family: 'Bebas Neue', serif;
  font-size: 1.3rem;
  letter-spacing: 0.14em;
  padding: 0.7rem;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: #86efac; }
.btn.danger {
  background: transparent;
  color: var(--red);
  border: 1px solid var(--red);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  padding: 0.3rem 0.7rem;
  width: auto;
}
.btn.danger:hover { background: rgba(248,113,113,0.1); }
.btn.danger:disabled { opacity: 0.4; cursor: not-allowed; }

.auth-error {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  color: var(--red);
  margin-bottom: 0.75rem;
  min-height: 1.2em;
}

/* ADMIN PANEL */
#admin-section { display: none; }

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.panel-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  color: var(--green);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.panel-title::before { content: '▶'; font-size: 0.45rem; }

.stats-chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem;
  color: var(--text3);
  letter-spacing: 0.1em;
}
.stats-chip em { color: var(--green); font-style: normal; }

.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 1rem;
}

.search-row .field {
  margin-bottom: 0;
  flex: 1;
}

/* TABLE */
.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
}

th {
  text-align: left;
  padding: 0.5rem 0.75rem;
  color: var(--text3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 0.58rem;
  border-bottom: 1px solid var(--border2);
  white-space: nowrap;
}

td {
  padding: 0.55rem 0.75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

tr:hover td { background: var(--bg2); }

.td-id { color: var(--text3); width: 50px; }
.td-name { color: var(--text2); white-space: nowrap; }
.td-amount { color: var(--green); font-weight: 600; white-space: nowrap; }
.td-memo { color: var(--text); max-width: 320px; word-break: break-word; }
.td-time { color: var(--text3); white-space: nowrap; }
.td-action { white-space: nowrap; }

.pagination {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 1.5rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem;
  color: var(--text3);
}

.page-btn {
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  padding: 0.35rem 0.75rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.page-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* TOAST */
#toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg2);
  border: 1px solid var(--green);
  color: var(--green);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  padding: 0.7rem 1.5rem;
  border-radius: 4px;
  letter-spacing: 0.1em;
  transition: transform 0.3s ease;
  z-index: 9999;
  white-space: nowrap;
}
#toast.error { border-color: var(--red); color: var(--red); }
#toast.show { transform: translateX(-50%) translateY(0); }

.empty-msg {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem;
  color: var(--text3);
  text-align: center;
  padding: 3rem 1rem;
  font-style: italic;
}

/* CONFIRM OVERLAY */
#confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 10000;
  align-items: center;
  justify-content: center;
}
#confirm-overlay.show { display: flex; }

.confirm-box {
  background: var(--bg2);
  border: 1px solid var(--red);
  border-radius: 6px;
  padding: 1.75rem 2rem;
  max-width: 380px;
  width: 90%;
}

.confirm-title {
  font-family: 'Bebas Neue', serif;
  font-size: 1.3rem;
  color: var(--red);
  letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}

.confirm-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  color: var(--text2);
  margin-bottom: 1.25rem;
  line-height: 1.6;
}

.confirm-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
}

.btn-cancel {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  padding: 0.4rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--text2); }

.btn-confirm-del {
  background: var(--red);
  color: #080808;
  border: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.4rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-confirm-del:hover { background: #fca5a5; }
</style>
</head>
<body>

<div id="toast"></div>

<div id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Delete Entry?</div>
    <div class="confirm-text" id="confirm-text">Are you sure you want to delete this donation? This cannot be undone.</div>
    <div class="confirm-actions">
      <button class="btn-cancel" id="confirm-cancel">Cancel</button>
      <button class="btn-confirm-del" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div class="header">
  <div>
    <div class="header-title">Admin Panel</div>
    <div class="header-sub">Pay It Down Please · Donations Management</div>
  </div>
  <a href="/" class="back-link">← Back to Site</a>
</div>

<!-- AUTH GATE -->
<div id="auth-section">
  <div class="container">
    <div class="auth-title">Admin Authentication Required</div>
    <div class="auth-error" id="auth-error"></div>
    <input class="field" type="password" id="token-input" placeholder="Enter admin token..." autocomplete="current-password">
    <button class="btn" id="auth-btn">Authenticate</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-section">
  <div class="container">
    <div class="panel-header">
      <div class="panel-title">Donation Entries</div>
      <div class="stats-chip">Total: <em id="total-count">—</em></div>
    </div>

    <div class="search-row">
      <input class="field" type="text" id="search-input" placeholder="Filter by name or memo...">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Amount</th>
            <th>Memo</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="donations-tbody">
          <tr><td colspan="6"><div class="empty-msg">Loading...</div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button class="page-btn" id="prev-btn" disabled>← Prev</button>
      <span id="page-info">Page 1</span>
      <button class="page-btn" id="next-btn" disabled>Next →</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 50;
let adminToken = '';
let currentPage = 0;
let totalCount = 0;
let searchFilter = '';
let allDonations = [];
let filteredDonations = [];
let pendingDeleteId = null;

function fmt(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function formatDate(ts) {
  const d = new Date(ts > 1e12 ? ts : ts * 1000);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (error ? ' error' : '');
  setTimeout(() => t.className = '', 3000);
}

// ── AUTH ──
document.getElementById('auth-btn').addEventListener('click', attemptAuth);
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') attemptAuth();
});

async function attemptAuth() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) {
    document.getElementById('auth-error').textContent = 'Token required';
    return;
  }
  document.getElementById('auth-btn').disabled = true;
  document.getElementById('auth-btn').textContent = 'Verifying...';
  try {
    const resp = await fetch('/api/admin/donations?limit=1', {
      headers: { 'X-Admin-Token': token }
    });
    if (resp.status === 401 || resp.status === 503) {
      const data = await resp.json();
      document.getElementById('auth-error').textContent = data.error || 'Invalid token';
      return;
    }
    if (!resp.ok) throw new Error('Server error');
    adminToken = token;
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('admin-section').style.display = 'block';
    loadDonations();
  } catch (e) {
    document.getElementById('auth-error').textContent = 'Authentication failed';
  } finally {
    document.getElementById('auth-btn').disabled = false;
    document.getElementById('auth-btn').textContent = 'Authenticate';
  }
}

// ── LOAD ──
async function loadDonations() {
  try {
    const resp = await fetch('/api/admin/donations?limit=2000', {
      headers: { 'X-Admin-Token': adminToken }
    });
    if (!resp.ok) { showToast('Failed to load donations', true); return; }
    const data = await resp.json();
    allDonations = data.donations;
    totalCount = data.total;
    document.getElementById('total-count').textContent = totalCount.toLocaleString();
    applyFilter();
  } catch (e) {
    showToast('Error loading donations', true);
  }
}

// ── SEARCH ──
document.getElementById('search-input').addEventListener('input', function() {
  searchFilter = this.value.toLowerCase();
  currentPage = 0;
  applyFilter();
});

function applyFilter() {
  filteredDonations = searchFilter
    ? allDonations.filter(d =>
        d.name.toLowerCase().includes(searchFilter) ||
        (d.memo || '').toLowerCase().includes(searchFilter)
      )
    : allDonations;
  renderPage();
}

// ── RENDER ──
function renderPage() {
  const start = currentPage * PAGE_SIZE;
  const page = filteredDonations.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('donations-tbody');

  if (!page.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-msg">No entries found.</div></td></tr>';
  } else {
    tbody.innerHTML = page.map(d => `
      <tr data-id="${d.id}">
        <td class="td-id">${d.id}</td>
        <td class="td-name">@${escHtml(d.name)}</td>
        <td class="td-amount">${fmt(d.amount)}</td>
        <td class="td-memo">${escHtml(d.memo || '')}</td>
        <td class="td-time">${formatDate(d.created_at)}</td>
        <td class="td-action">
          <button class="btn danger" onclick="confirmDelete(${d.id}, '${escHtml(d.name)}', '${escHtml(String(d.amount))}')">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  const totalPages = Math.max(1, Math.ceil(filteredDonations.length / PAGE_SIZE));
  document.getElementById('page-info').textContent = `Page ${currentPage + 1} of ${totalPages} (${filteredDonations.length} entries)`;
  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = (currentPage + 1) >= totalPages;
}

document.getElementById('prev-btn').addEventListener('click', () => { currentPage--; renderPage(); });
document.getElementById('next-btn').addEventListener('click', () => { currentPage++; renderPage(); });

// ── DELETE ──
function confirmDelete(id, name, amount) {
  pendingDeleteId = id;
  document.getElementById('confirm-text').textContent =
    `Delete @${name}'s donation of $${amount}? This will also update the leaderboard. Cannot be undone.`;
  document.getElementById('confirm-overlay').classList.add('show');
}

document.getElementById('confirm-cancel').addEventListener('click', () => {
  document.getElementById('confirm-overlay').classList.remove('show');
  pendingDeleteId = null;
});

document.getElementById('confirm-ok').addEventListener('click', async () => {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  pendingDeleteId = null;
  document.getElementById('confirm-overlay').classList.remove('show');

  try {
    const resp = await fetch(`/api/admin/donations/${id}`, {
      method: 'DELETE',
      headers: { 'X-Admin-Token': adminToken }
    });
    const data = await resp.json();
    if (!resp.ok) { showToast(data.error || 'Delete failed', true); return; }

    // Remove from local cache and re-render
    allDonations = allDonations.filter(d => d.id !== id);
    totalCount--;
    document.getElementById('total-count').textContent = totalCount.toLocaleString();
    applyFilter();
    showToast('Entry deleted');
  } catch (e) {
    showToast('Delete failed', true);
  }
});

// close overlay on backdrop click
document.getElementById('confirm-overlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('show');
    pendingDeleteId = null;
  }
});
</script>
</body>
</html>
